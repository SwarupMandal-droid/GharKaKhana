{% extends 'base.html' %}
{% block title %}Check Your Email — GharKhana{% endblock %}

{% block content %}
<div class="auth-page animate-fade">
  <div class="card auth-card" style="text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 16px;">📧</div>
    <div class="auth-logo">🍲</div>
    <h2 style="font-size: 2rem; margin: 16px 0 8px;">Check your inbox</h2>
    <p style="font-size: 0.95rem; color: var(--p-gray-500); line-height: 1.7; margin-bottom: 28px;">
      We've sent a password reset link to your email address.
      It should arrive within a minute — don't forget to check your spam folder.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary btn-full">
      Back to login
    </a>
  </div>
</div>
{% endblock %}
