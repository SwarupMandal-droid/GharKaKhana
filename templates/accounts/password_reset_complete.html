{% extends 'base.html' %}
{% block title %}Password Reset Complete — GharKhana{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="text-align:center">
    <div style="font-size:4rem;margin-bottom:20px">✅</div>
    <h2 style="margin-bottom:12px">Password reset!</h2>
    <p style="color:var(--gray-500);margin-bottom:32px">
      Your password has been set successfully. You can now log in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary btn-full">
      Log in now
    </a>
  </div>
</div>
{% endblock %}
